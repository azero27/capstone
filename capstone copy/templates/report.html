<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Report Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <!-- Sidebar -->
  <div class="side-bar" id="sideBar">
    <div class="side-nav-bg"></div>
    <div class="text-medium-11-gray sidebar-text">
      <div class="toggle-sidebar2" onclick="toggleSidebar()">Toggle sidebar</div>
    </div>
    <img class="icon-menu-toggle"
         src="{{ url_for('static', filename='icon/icon_menu_toggle.svg') }}"
         id="toggleIcon" onclick="toggleSidebar()" />

    <div class="menu-inactive sidebar-text" onclick="movetoSet()">
      <div class="settings2">Settings</div>
    </div>
    <img class="icon-menu-settings" src="{{ url_for('static', filename='icon/icon_menu_settings.svg') }}" />

    <div class="menu-active sidebar-text">
      <div class="email2">Report</div>
    </div>
    <img class="icon-menu-email" src="{{ url_for('static', filename='icon/icon_menu_email-active.svg') }}" />

    <div class="menu-inactive sidebar-text" onclick="movetoAr()">
      <div class="tasks2">Archiving</div>
    </div>
    <img class="icon-menu-tasks" src="{{ url_for('static', filename='icon/icon_menu_tasks.svg') }}" />

    <div class="menu-inactive sidebar-text" onclick="movetoSc()">
      <div class="dashboard2">Scan</div>
    </div>
    <img class="icon-menu-dashboard-active" src="{{ url_for('static', filename='icon/icon_menu_dashboard.svg') }}" />

    <div class="skyroute sidebar-text">Skyroute</div>
    <div class="side-nav-devider"></div>
    <img class="sr-1" src="{{ url_for('static', filename='icon/SR 1.svg') }}" />

    <div class="button-accent sidebar-text" onclick="handleManualScan()">
      <div class="rectangle-33"></div>
      <div class="top-button">SCAN</div>
    </div>
    <div class="button-accent sidebar-text" onclick="handleStop()">
      <div class="rectangle-3"></div>
      <div class="accent-button">STOP</div>
    </div>
    <div class="button-secondary sidebar-text" onclick="handleExit()">
      <div class="rectangle-32"></div>
      <div class="secondary-button">EXIT</div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <h2>리포트 생성</h2>

    <div class="report-filter-container">
      <!-- 날짜 필터 -->
      <div class="filter-group">
        <label for="startDate">시작 날짜</label>
        <input type="date" id="startDate" name="startDate">

        <label for="endDate">종료 날짜</label>
        <input type="date" id="endDate" name="endDate">
      </div>

      <div class="divider"></div>

      <!-- 리소스 필터 -->
      <div class="filter-group">
        <label>리소스 선택</label>
        <div id="resourceCheckboxes" class="checkbox-list">
          <!-- JS에서 동적으로 생성 -->
        </div>
      </div>
    </div>

    <button class="report-button" onclick="generateReport()">보고서 생성</button>

    <div id="reportResult" style="margin-top: 20px;"></div>
  </div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/report.js') }}"></script>
</body>
</html>
