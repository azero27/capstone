<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scanner UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/scan_sunburst.css') }}">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <div class="side-bar" id="sideBar">
    <div class="side-nav-bg"></div>
    <div class="text-medium-11-gray sidebar-text">
      <div class="toggle-sidebar2" onclick="toggleSidebar()">Toggle sidebar</div>
    </div>
    <img class="icon-menu-toggle" 
      data-open-src="{{ url_for('static', filename='icon/icon_menu_toggle.svg') }}"
      data-close-src="{{ url_for('static', filename='icon/icon_menu_toggle-active.svg') }}"
      src="{{ url_for('static', filename='icon/icon_menu_toggle.svg') }}" id="toggleIcon" onclick="toggleSidebar()" />
    
    <div class="menu-inactive sidebar-text" onclick="movetoSet()">
      <div class="settings2">Settings</div>
    </div>
    <img class="icon-menu-settings" src="{{ url_for('static', filename='icon/icon_menu_settings.svg') }}" />
    
    <div class="menu-inactive sidebar-text" onclick="movetoRe()">
      <div class="email2">Report</div>
    </div>
    <img class="icon-menu-email" src="{{ url_for('static', filename='icon/icon_menu_email.svg') }}" />
    
    <div class="menu-inactive sidebar-text" onclick="movetoAr()">
      <div class="tasks2">Archiving</div>
    </div>
    <img class="icon-menu-tasks" src="{{ url_for('static', filename='icon/icon_menu_tasks.svg') }}" />
    
    <div class="menu-active sidebar-text">
      <div class="dashboard2">Scan</div>
    </div>
    <img class="icon-menu-dashboard-active" src="{{ url_for('static', filename='icon/icon_menu_dashboard-active.svg') }}" />
    
    <div class="skyroute sidebar-text">Skyroute</div>
    <div class="side-nav-devider"></div>
    <img class="sr-1" src="{{ url_for('static', filename='icon/SR 1.svg') }}" />

    
    <div class="button-accent sidebar-text" onclick="handleManualScan()">
      <div class="rectangle-33"></div>
      <div class="top-button">SCAN</div>
    </div>
    <div class="button-accent sidebar-text" onclick="handleStop()">
      <div class="rectangle-3"></div>
      <div class="accent-button">STOP</div>
    </div>
    <div class="button-secondary sidebar-text" onclick="handleExit()">
      <div class="rectangle-32"></div>
      <div class="secondary-button">EXIT</div>
    </div>
  </div>
  
<div class="scan-layout">
  <div class="left-column">
    <div class="scan-visual-block">
      <h2>SCAN</h2>
      <div id="scanTree" class="scan-tree"></div>
    </div>

    <div class="scan-result-block">
      <h2>SCAN RESULT</h2>
      <table class="scan-table">
        <thead>
          <tr>
            <th>Step</th>
            <th>Tool</th>
            <th>Status</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="resultTableBody"></tbody>
      </table>
    </div>
  </div>

<div class="scan-chart-block">
  <h2 style="display: flex; align-items: center; gap: 10px;">
    <button id="sunburstBackBtn" class="sunburst-back-btn" style="display: none;">
      <span class="back-icon">&#x25C0;</span> BACK
    </button>
    SCAN CHART
  </h2>
  <div id="sunburstChart"></div>
  <div id="sunburstTooltip" class="sunburst-tooltip"></div>
</div>

  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  <script src="{{ url_for('static', filename='js/scan.js') }}"></script>
  <!-- 로그 팝업 -->
<div id="logPopup" class="popup hidden">
  <div class="popup-content">
    <span class="close-btn" onclick="closeLogPopup()">&times;</span>
    <h3>Scan Log</h3>
    <pre id="logContent"></pre>
  </div>
</div>

</body>
</html>
